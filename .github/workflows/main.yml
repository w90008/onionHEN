name: Build onionHEN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب كود المشروع الأساسي
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'false'

    # 2. جلب وتصحيح الـ Submodules يدوياً وتخطي الملف المفقود في BearSSL
    - name: Initialize Submodules Manually
      run: |
        git submodule init
        git submodule update --init --depth 1 third_party/kstuff-lite
        cd third_party/kstuff-lite
        git submodule init
        git submodule update --init --remote --recursive --depth 1 || true
        cd ../../

    # 3. تعديل ملف الـ Dockerfile برمجياً لإلغاء أمر الـ git submodule update الداخلي المعطوب
    - name: Patch Dockerfile to skip internal git update
      run: |
        if [ -f Dockerfile ]; then
          # حذف أمر تحديث الـ submodule الداخلي من سطر البناء ليعتمد على الملفات المجهزة بالخارج
          sed -i 's/git -C \/workspace submodule update --init --recursive &&//g' Dockerfile
        fi

    # 4. إعداد بيئة Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 5. بناء الحاوية البرمجية والمشروع
    - name: Build with Docker Compose
      run: |
        docker compose build

    # 6. استخراج ملفات البناء النهائية (Artifacts)
    - name: Extract Build Artifacts
      run: |
        docker compose up --no-start
        mkdir -p ./compiled_output
        docker cp $(docker compose ps -q | head -n 1):/app/build ./compiled_output || docker cp $(docker compose ps -q | head -n 1):/workspace/build ./compiled_output || echo "No build folder found"
        
    # 7. رفع الملفات الناتجة لتظهر للتحميل في تبويب Actions
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: onionHEN-PS5-PS4-Build
        path: ./compiled_output/
