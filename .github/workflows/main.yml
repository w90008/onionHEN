name: Build onionHEN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب كود المشروع الأساسي
    - name: Checkout repository
      uses: actions/checkout@v4.2.2
      with:
        submodules: 'false'

    # 2. جلب وتصحيح الـ Submodules يدوياً
    - name: Initialize Submodules Manually
      run: |
        git submodule init
        git submodule update --init --depth 1 third_party/kstuff-lite
        cd third_party/kstuff-lite
        git submodule init
        git submodule update --init --remote --recursive --depth 1 || true
        cd ../../

    # 3. تعديل ملف الـ Dockerfile برمجياً لإلغاء أمر الـ git submodule update الداخلي المعطوب
    - name: Patch Dockerfile to skip internal git update
      run: |
        if [ -f Dockerfile ]; then
          sed -i 's/git -C \/workspace submodule update --init --recursive &&//g' Dockerfile
        fi

    # 4. إعداد بيئة Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.10.0

    # 5. بناء الحاوية البرمجية والمشروع
    - name: Build with Docker Compose
      run: |
        docker compose build

    # 6. البحث الذكي واستخراج كافة ملفات البناء النهائية من داخل الحاوية
    - name: Smart Extract Build Artifacts
      run: |
        # تشغيل الحاوية في الخلفية بشكل مؤقت لقراءة محتواها
        docker compose up --no-start
        CONTAINER_ID=$(docker compose ps -q | head -n 1)
        
        mkdir -p ./compiled_output
        echo "Searching for built artifacts inside container..."
        
        # البحث عن المجلدات الشائعة للمخرجات ونسخ محتواها إن وجدت
        docker cp $CONTAINER_ID:/workspace/out/. ./compiled_output/ 2>/dev/null || true
        docker cp $CONTAINER_ID:/workspace/build/. ./compiled_output/ 2>/dev/null || true
        docker cp $CONTAINER_ID:/app/build/. ./compiled_output/ 2>/dev/null || true
        docker cp $CONTAINER_ID:/app/out/. ./compiled_output/ 2>/dev/null || true
        
        # بحث شامل عن أي ملفات تنفيذية ناتجة (مثل .elf أو .pkg) تم إنشاؤها وتجميعها في الحاوية ونسخها
        docker exec $CONTAINER_ID find /workspace /app -type f \( -name "*.elf" -o -name "*.pkg" -o -name "*.bin" -o -name "*.sprx" \) -exec docker cp $CONTAINER_ID:{} ./compiled_output/ \; 2>/dev/null || true
        
        # التأكد من وجود ملفات، إذا كان المجلد لا يزال فارغاً، انسخ كامل مجلد العمل لمعاينته
        if [ -z "$(ls -A ./compiled_output)" ]; then
          echo "No targeted files found, copying entire workspace for debug."
          docker cp $CONTAINER_ID:/workspace/. ./compiled_output/ 2>/dev/null || docker cp $CONTAINER_ID:/app/. ./compiled_output/ 2>/dev/null
        fi

    # 7. رفع الملفات المجمعة والناتجة للتحميل
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4.6.1
      with:
        name: onionHEN-Final-Artifacts
        path: ./compiled_output/
