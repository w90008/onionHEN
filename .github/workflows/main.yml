name: Build onionHEN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب كود المشروع الأساسي فقط بدون الـ Submodules لتفادي الخطأ
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'false'

    # 2. إعداد سحب المستودعات الفرعية يدويًا مع تخطي الأخطاء وسحب أحدث نسخة متوفرة
    - name: Initialize Submodules Manually
      run: |
        git submodule init
        # سحب kstuff-lite بدون المجلدات الداخلية المعطوبة التابعة له أولاً
        git submodule update --init --depth 1 third_party/kstuff-lite
        
        # الدخول إلى kstuff-lite وتحديث المستودعات الداخلية الخاصة به مع تجاهل التحديث العميق الصارم
        cd third_party/kstuff-lite
        git submodule init
        # استخدام التحديث البعيد لجلب النسخ المتوفرة حالياً وتخطي الـ Commit المفقود
        git submodule update --init --remote --recursive --depth 1 || true
        cd ../../

    # 3. إعداد بيئة Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. بناء المشروع باستخدام Docker Compose
    - name: Build with Docker Compose
      run: |
        docker compose build

    # 5. استخراج ملفات الحزم والـ Binaries الناتجة للبناء
    - name: Extract Build Artifacts
      run: |
        docker compose up --no-start
        mkdir -p ./compiled_output
        docker cp $(docker compose ps -q | head -n 1):/app/build ./compiled_output || docker cp $(docker compose ps -q | head -n 1):/workspace/build ./compiled_output || echo "No build folder found"
        
    # 6. رفع الملفات المجمعة للتحميل
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: onionHEN-PS4-Build
        path: ./compiled_output/
