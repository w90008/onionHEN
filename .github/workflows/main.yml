name: Build onionHEN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من موقع جيتهاب

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب كود المشروع والمجلدات الفرعية (Submodules) مثل kstuff-lite
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. إعداد بيئة Docker Buildx المتطورة للبناء
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. بناء المشروع باستخدام Dockerfile وملف الـ Compose المرفقين في مشروعك
    - name: Build with Docker Compose
      run: |
        docker compose build

    # 4. تشغيل الحاوية المؤقتة لاستخراج ملفات الحزم والـ Binaries الناتجة للبناء
    - name: Extract Build Artifacts
      run: |
        # نقوم بإنشاء الحاوية لاستخراج الملفات المجمعة منها قبل حذفها
        docker compose up --no-start
        
        # استبدل كلمة 'app' باسم الخدمة المكتوبة داخل ملف docker-compose.yml لديك إذا اختلف الاسم
        # سنقوم بنسخ المخرجات إلى مجلد محلي يسمى compiled_output
        mkdir -p ./compiled_output
        docker cp $(docker compose ps -q | head -n 1):/app/build ./compiled_output || docker cp $(docker compose ps -q | head -n 1):/workspace/build ./compiled_output || echo "No build folder found, uploading context"
        
    # 5. رفع الملفات المجمعة لتظهر لك في تبويب Actions للتحميل المباشر
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: onionHEN-PS4-Build
        path: ./compiled_output/

