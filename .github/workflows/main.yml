name: Build onionHEN

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fix line endings
        run: |
          find . -type f \( -name "*.sh" -o -name "*.bash" \) -print0 \
            | xargs -0 -r sed -i 's/\r$//'

      - name: Build Docker image
        run: |
          docker build \
            --build-arg HOST_UID=1000 \
            --build-arg HOST_GID=1000 \
            -t onionhen-builder .

      - name: Run onionHEN build
        run: |
          mkdir -p compiled_output

          docker run \
            --name onionhen-build \
            onionhen-builder

      - name: Extract build
        if: always()
        run: |
          mkdir -p compiled_output

          docker cp onionhen-build:/workspace/build ./compiled_output/build \
            || true

          echo ""
          echo "===== BUILD OUTPUT ====="
          find ./compiled_output -type f \
            \( -name "*.elf" -o -name "*.bin" -o -name "*.lzma" -o -name "*.map" \) \
            -print || true

      - name: Show build log
        if: always()
        run: |
          docker logs onionhen-build || true

      - name: Create build information
        if: always()
        run: |
          {
            echo "onionHEN GitHub Actions Build"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Date: $(date -u)"
          } > compiled_output/build_info.txt

      - name: Upload onionHEN build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onionHEN-build-${{ github.sha }}
          path: compiled_output/
          if-no-files-found: warn
